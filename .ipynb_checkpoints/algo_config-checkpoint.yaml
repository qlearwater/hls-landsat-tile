algorithm:
  name: hls_landsat_pipeline
  description: Process Landsat to HLS per granule

runtime:
  docker_image: mas.maap-project.org/root/maap-workspaces/base:latest

command: >
  python hls_landsat_pipeline_dps.py
  --mgrs_tile {tile}
  --date {date}

inputs:
  - name: mgrs_tile
    type: string
  - name: date
    type: string